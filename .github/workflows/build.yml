name: build

# A tag like v1.0.0-beta.1, or a manual run with a version, publishes a release.
# Branch pushes only build when this file changes.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.0.0-beta.2. Leave empty to only build.
        required: false
        type: string

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      args: ${{ steps.version.outputs.args }}
    steps:
      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          version="${INPUT#v}"
          if [[ -z "$version" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          args="--build-number=$GITHUB_RUN_NUMBER"
          if [[ -n "$version" ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::$version is not a version like 1.2.3 or 1.2.3-beta.1"
              exit 1
            fi
            args="$args --build-name=${version%%-*} --dart-define=APP_VERSION=$version"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # 22.04 for its older glibc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release ${{ needs.version.outputs.args }}
      - run: |
          tar -czf backscroll-linux-x64.tar.gz -C build/linux/x64/release \
            --transform 's,^bundle,backscroll,' bundle
      - uses: actions/upload-artifact@v4
        with:
          name: backscroll-linux-x64
          path: backscroll-linux-x64.tar.gz

  windows:
    needs: version
    runs-on: windows-latest
    outputs:
      signer: ${{ steps.sign.outputs.signer }}
      thumbprint: ${{ steps.sign.outputs.thumbprint }}
      self_signed: ${{ steps.sign.outputs.self_signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release ${{ needs.version.outputs.args }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Sign the app
        id: sign
        shell: pwsh
        env:
          RELEASE: ${{ needs.version.outputs.tag }}
          STORETYPE: ${{ secrets.WINDOWS_SIGN_STORETYPE }}
          KEYSTORE: ${{ secrets.WINDOWS_SIGN_KEYSTORE }}
          STOREPASS: ${{ secrets.WINDOWS_SIGN_STOREPASS }}
          KEYPASS: ${{ secrets.WINDOWS_SIGN_KEYPASS }}
          ALIAS: ${{ secrets.WINDOWS_SIGN_ALIAS }}
          SIGN_FILE: ${{ secrets.WINDOWS_SIGN_FILE }}
          CERTCHAIN: ${{ secrets.WINDOWS_SIGN_CERTCHAIN }}
        run: |
          if (-not $env:STORETYPE) {
            if ($env:RELEASE) {
              echo "::error::Releases need the Windows signing secrets, see docs/building.md."
              exit 1
            }
            echo "::warning::No WINDOWS_SIGN_STORETYPE secret, so the Windows build is unsigned."
            exit 0
          }
          $jar = Join-Path $env:RUNNER_TEMP jsign.jar
          Invoke-WebRequest https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar -OutFile $jar
          if ((Get-FileHash $jar).Hash -ne '602A51C3545A6DC4FB99BD2EA7152B26D1345916D0C93DDFBD5936CB735AF91C') {
            throw 'jsign.jar does not match its checksum'
          }
          $file = Join-Path $env:RUNNER_TEMP sign-file
          if ($env:SIGN_FILE) {
            [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:SIGN_FILE))
          }
          foreach ($name in 'KEYSTORE', 'STOREPASS', 'KEYPASS') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { [Environment]::SetEnvironmentVariable($name, $value.Replace('{file}', $file)) }
          }
          $options = @(
            '--storetype', $env:STORETYPE,
            '--storepass', 'env:STOREPASS',
            '--name', 'Backscroll',
            '--url', 'https://github.com/Subsical/Backscroll',
            '--tsaurl', 'http://timestamp.digicert.com,http://timestamp.sectigo.com',
            '--tsmode', 'RFC3161'
          )
          if ($env:KEYSTORE) { $options += '--keystore', $env:KEYSTORE }
          elseif ($env:SIGN_FILE) { $options += '--keystore', $file }
          if ($env:KEYPASS) { $options += '--keypass', 'env:KEYPASS' }
          if ($env:ALIAS) { $options += '--alias', $env:ALIAS }
          if ($env:CERTCHAIN) {
            $chain = Join-Path $env:RUNNER_TEMP chain.pem
            Set-Content $chain $env:CERTCHAIN
            $options += '--certfile', $chain
          }
          # DLLs that Microsoft already signed keep their signature.
          $release = 'build/windows/x64/runner/Release'
          $files = Get-ChildItem $release -Recurse -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' } |
            ForEach-Object FullName
          java -jar $jar @options @files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $certificate = (Get-AuthenticodeSignature "$release/backscroll.exe").SignerCertificate
          $selfSigned = $certificate.Subject -eq $certificate.Issuer
          # windows reports an untrusted self-signed root as UnknownError
          $accepted = if ($selfSigned) { 'Valid', 'UnknownError' } else { 'Valid' }
          foreach ($path in $files) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -notin $accepted -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
              throw "$path is not signed properly: $($signature.StatusMessage)"
            }
          }
          $signer = $certificate.GetNameInfo('SimpleName', $false)
          "signer=$signer" >> $env:GITHUB_OUTPUT
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "self_signed=$("$selfSigned".ToLower())" >> $env:GITHUB_OUTPUT
          "Signed $($files.Count) files as $signer, certificate thumbprint $($certificate.Thumbprint)" >> $env:GITHUB_STEP_SUMMARY
      - name: Bundle the VC++ runtime
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:SystemRoot/System32/$dll" $release
          }
          Compress-Archive -Path "$release/*" -DestinationPath backscroll-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: backscroll-windows-x64
          path: backscroll-windows-x64.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.apk.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up the signing key
        id: key
        env:
          RELEASE: ${{ needs.version.outputs.tag }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then
            if [[ -n "$RELEASE" ]]; then
              echo "::error::Releases need the Android signing secrets, see docs/building.md."
              exit 1
            fi
            echo "::warning::No ANDROID_KEYSTORE secret, so the APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: flutter build apk --release ${{ needs.version.outputs.args }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk backscroll-android.apk
      - name: Check the signature
        id: apk
        if: steps.key.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          fingerprint=$(keytool -list -v -keystore android/app/upload.jks -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certificates=$("$apksigner" verify --print-certs backscroll-android.apk)
          if [[ -z "$fingerprint" ]] || ! grep -qi "SHA-256 digest: ${fingerprint//:/}" <<< "$certificates"; then
            echo "::error::The APK is not signed with the key from ANDROID_KEYSTORE."
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "APK signing certificate SHA-256: $fingerprint" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backscroll-android
          path: backscroll-android.apk

  release:
    needs: [version, linux, windows, android]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign the checksums
        id: gpg
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sha256sum * > SHA256SUMS.txt
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::Releases need the GPG_PRIVATE_KEY secret, see docs/building.md."
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          base64 --decode <<< "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" |
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign SHA256SUMS.txt
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ { print $10; exit }')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          APK_FINGERPRINT: ${{ needs.android.outputs.fingerprint }}
          WINDOWS_SIGNER: ${{ needs.windows.outputs.signer }}
          WINDOWS_THUMBPRINT: ${{ needs.windows.outputs.thumbprint }}
          WINDOWS_SELF_SIGNED: ${{ needs.windows.outputs.self_signed }}
        run: |
          for name in GPG_FINGERPRINT APK_FINGERPRINT WINDOWS_THUMBPRINT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is empty, so the release notes would be wrong."
              exit 1
            fi
          done
          if [[ "$WINDOWS_SELF_SIGNED" == true ]]; then
            WINDOWS_FIRST_RUN="It is signed with a self-signed certificate, which Windows doesn't know, so SmartScreen stops it the first time: choose **More info**, then **Run anyway**."
            WINDOWS_SIGNATURE="The Windows app is signed with a self-signed certificate, the same one in every release, with the thumbprint \`$WINDOWS_THUMBPRINT\`."
          else
            WINDOWS_FIRST_RUN="The app is signed, but SmartScreen can still stop it the first time while the certificate is new: choose **More info**, then **Run anyway**."
            WINDOWS_SIGNATURE="The Windows app is signed by $WINDOWS_SIGNER, with the certificate thumbprint \`$WINDOWS_THUMBPRINT\`."
          fi
          notes=$(mktemp)
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
            printf '%s\n\n' "This is a beta, so expect rough edges. Please report anything that breaks." > "$notes"
          fi
          template=$(< .github/release-notes.md)
          for name in OWNER GPG_FINGERPRINT APK_FINGERPRINT WINDOWS_FIRST_RUN WINDOWS_SIGNATURE; do
            template=${template//"\$$name"/"${!name}"}
          done
          printf '%s\n' "$template" >> "$notes"
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Backscroll ${TAG#v}" \
            --notes-file "$notes" \
            "${flags[@]}"
