name: backscroll
description: "Export Discord chats to HTML, JSON, TXT and CSV"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  desktop_webview_window: ^0.3.1
  file_picker: ^13.1.0
  flutter_foreground_task: ^11.0.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.3
  mime: ^2.1.0
  path: ^1.9.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.7.0
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  xml: ^7.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/export/
    - assets/fonts/OFL.txt
    - assets/icon/app_icon.png
    - LICENSE
    - PRIVACY.md
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Italic.ttf
          style: italic
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
